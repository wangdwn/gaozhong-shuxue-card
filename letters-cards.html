<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>给高二的 60 封信 · 选自《人民日报》评论</title>
<style>
  :root{
    --ink:#1d2430; --ink-2:#4a5464; --ink-3:#7b8698;
    --paper:#ffffff; --paper-2:#f6f7f9; --line:#e2e6ec;
    --blue:#0b5fa5; --blue-soft:#eaf2fa;
    --red:#b02a2a; --red-soft:#fbecec;
    --green:#1a7f4b; --green-soft:#e9f5ee;
    --amber:#a9711a; --amber-soft:#fdf4e4;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    color:var(--ink); background:var(--paper-2); line-height:1.75; padding:0 0 60px;
    -webkit-font-smoothing:antialiased}
  a{color:var(--blue); text-decoration:none}
  .wrap{max-width:820px; margin:0 auto; padding:0 14px}

  header{border-bottom:1px solid var(--line); background:var(--paper)}
  header .bar{max-width:820px; margin:0 auto; padding:16px 14px 12px}
  header .top{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  header h1{font-size:1.28rem; font-weight:800; letter-spacing:.5px}
  header .back{margin-left:auto; font-size:.78rem; color:var(--ink-3)}
  header .meta{font-family:var(--mono); font-size:.7rem; color:var(--ink-3); margin-top:8px; line-height:1.7}

  .panel{background:var(--paper); border:1px solid var(--line); border-radius:10px; margin-top:14px}
  .panel .ph{padding:12px 14px 6px; font-family:var(--mono); font-size:.7rem; color:var(--ink-3); letter-spacing:.5px}
  .chips{display:flex; flex-wrap:wrap; gap:6px; padding:6px 14px 12px}
  .chip{font-size:.78rem; padding:5px 11px; border:1px solid var(--line); border-radius:999px;
    background:var(--paper); color:var(--ink-2); cursor:pointer; white-space:nowrap; transition:.15s; user-select:none}
  .chip:hover{border-color:#c4ccd8}
  .chip.on{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600}
  .chip.mini{font-size:.72rem; padding:4px 9px}

  .status{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:0 14px 12px; font-size:.8rem; color:var(--ink-2)}
  .track{flex:1; min-width:120px; height:7px; background:#eceff3; border-radius:4px; overflow:hidden}
  .track i{display:block; height:100%; background:var(--green); width:0%}
  .btn{font-size:.78rem; padding:6px 12px; border:1px solid var(--line); background:var(--paper);
    border-radius:7px; cursor:pointer; color:var(--ink-2); font-family:inherit}
  .btn:hover{border-color:#c4ccd8}
  .btn.primary{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600}

  .list{margin-top:14px; display:flex; flex-direction:column; gap:12px}
  .card{background:var(--paper); border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .card .cm{display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 16px;
    border-bottom:1px solid var(--line); font-family:var(--mono); font-size:.68rem; color:var(--ink-3)}
  .badge{font-family:var(--mono); font-size:.66rem; padding:2px 7px; border-radius:5px; white-space:nowrap}
  .b-no{background:#f1f3f6; color:var(--ink-3)}
  .b-theme{background:var(--blue-soft); color:var(--blue); font-weight:700}
  .b-src{background:#f1f3f6; color:var(--ink-3)}
  .b-ok{background:var(--green-soft); color:var(--green)}
  .b-no2{background:var(--red-soft); color:var(--red)}

  .card .q{padding:16px}
  .card .q h3{font-size:1.06rem; font-weight:800; letter-spacing:.2px; margin-bottom:6px}
  .gist{font-size:.86rem; color:var(--ink-3); margin-bottom:12px; padding-bottom:10px; border-bottom:1px dashed var(--line)}
  .quotes{list-style:none; display:flex; flex-direction:column; gap:8px}
  .quotes li{position:relative; padding-left:16px; font-size:.95rem; color:#2a3442; line-height:1.85}
  .quotes li:before{content:"「"; position:absolute; left:0; color:var(--ink-3)}
  .quotes li:after{content:"」"; color:var(--ink-3)}
  .act{margin-top:14px; padding:10px 12px; background:var(--amber-soft); border-left:3px solid var(--amber);
    border-radius:0 6px 6px 0; font-size:.88rem; color:#5c4110; line-height:1.8}
  .act b{color:var(--amber); font-weight:700}
  .card .acts{display:flex; gap:8px; align-items:center; padding:0 16px 14px; flex-wrap:wrap}
  .card .acts .src{margin-left:auto; font-family:var(--mono); font-size:.68rem; color:var(--ink-3)}
  .mark-ok{border-color:#bfe3cd}
  .mark-no{border-color:#eec9c9}
  .empty{text-align:center; color:var(--ink-3); font-size:.85rem; padding:40px 0}
  .hidden{display:none!important}
  footer{max-width:820px; margin:22px auto 0; padding:0 14px; font-family:var(--mono);
    font-size:.68rem; color:var(--ink-3); line-height:1.95}
  @media(max-width:600px){
    header h1{font-size:1.1rem}
    .card .q{padding:13px}
    .card .q h3{font-size:1rem}
    .quotes li{font-size:.92rem}
    .act{font-size:.85rem}
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="top">
      <h1>给高二的 60 封信</h1>
      <a class="back" href="index.html">← 知识卡片站</a>
    </div>
    <div class="meta" id="metaLine">数据加载中…</div>
  </div>
</header>

<div class="wrap">

  <div class="panel">
    <div class="ph">主题</div>
    <div class="chips" id="themeChips"></div>
    <div class="ph">状态</div>
    <div class="chips" id="stateChips"></div>
    <div class="ph">进度</div>
    <div class="status">
      <span id="progText">已读 0 / 0</span>
      <span class="track"><i id="progBar"></i></span>
      <button class="btn" id="resetBtn">重置进度</button>
    </div>
  </div>

  <div class="list" id="list"></div>
  <div class="empty hidden" id="empty">这个筛选下没有信，换个条件试试</div>
  <div style="text-align:center;margin-top:16px">
    <button class="btn primary" id="moreBtn">加载更多</button>
  </div>

  <footer>
    内容为《人民日报》评论版「人民论坛」等栏目文章的原文摘句，每封标注见报日期并附人民网原文链接。<br>
    摘句逐字取自原文，未作改写；「给高二的动作」为编者所加，与原文无关。<br>
    仅作个人学习使用，版权归人民日报社所有。<span id="genLine"></span>
  </footer>
</div>

<script src="letters_data.js"></script>
<script>
(function(){
  var letters = window.__letters || [], meta = window.__lettersMeta || {};
  var THEMES = ['专注','行动','心态','方法','踏实','格局'];
  var LS_OK = 'lt_read_v1', LS_NO = 'lt_back_v1';
  var ok = load(LS_OK), no = load(LS_NO);
  var state = { theme:'', st:'', page:1, per:12 };

  function load(k){ try{ return JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){ return []; } }
  function save(){ try{ localStorage.setItem(LS_OK, JSON.stringify(ok));
    localStorage.setItem(LS_NO, JSON.stringify(no)); }catch(e){} }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function has(a,id){ return a.indexOf(id) >= 0; }
  function toggle(a,id){ var i=a.indexOf(id); if(i<0) a.push(id); else a.splice(i,1); return a; }

  function filtered(){
    return letters.filter(function(L){
      if(state.theme && L['主题'] !== state.theme) return false;
      if(state.st === 'done' && !has(ok, L.id)) return false;
      if(state.st === 'back' && !has(no, L.id)) return false;
      if(state.st === 'todo' && (has(ok, L.id) || has(no, L.id))) return false;
      return true;
    });
  }

  function chips(host, items, getOn, onPick){
    host.innerHTML = '';
    items.forEach(function(it){
      var d = document.createElement('div');
      d.className = 'chip' + (getOn(it) ? ' on' : '') + (it.mini ? ' mini' : '');
      d.textContent = it.n;
      d.onclick = function(){ onPick(it); draw(); };
      host.appendChild(d);
    });
  }

  function cardHTML(L){
    var isOk = has(ok, L.id), isNo = has(no, L.id);
    var h = '<div class="card' + (isOk ? ' mark-ok' : (isNo ? ' mark-no' : '')) + '" id="c_' + L.id + '">';
    h += '<div class="cm"><span class="badge b-no">第 ' + L['序号'] + ' 封</span>'
       + '<span class="badge b-theme">' + esc(L['主题']) + '</span>'
       + '<span class="badge b-src">人民日报 · ' + esc(L['日期']) + '</span>'
       + (isOk ? '<span class="badge b-ok">已读</span>' : '')
       + (isNo ? '<span class="badge b-no2">待回炉</span>' : '')
       + '</div>';
    h += '<div class="q"><h3>' + esc(L['标题']) + '</h3>';
    if(L['概括']) h += '<div class="gist">' + esc(L['概括']) + '</div>';
    h += '<ul class="quotes">';
    (L['金句']||[]).forEach(function(s){ h += '<li>' + esc(s) + '</li>'; });
    h += '</ul>';
    if(L['动作']) h += '<div class="act"><b>给高二的动作 · </b>' + esc(L['动作']) + '</div>';
    h += '</div>';
    h += '<div class="acts">'
       + '<button class="btn" data-act="ok" data-id="' + L.id + '">读了</button>'
       + '<button class="btn" data-act="no" data-id="' + L.id + '">回头再看</button>'
       + '<a class="src" href="' + esc(L['url']) + '" target="_blank" rel="noopener">读原文 →</a>'
       + '</div>';
    h += '</div>';
    return h;
  }

  function draw(){
    var all = filtered();
    var show = all.slice(0, state.page * state.per);
    document.getElementById('list').innerHTML = show.map(cardHTML).join('');
    document.getElementById('empty').className = show.length ? 'empty hidden' : 'empty';
    document.getElementById('moreBtn').style.display = all.length > show.length ? '' : 'none';
    var total = letters.length, done = letters.filter(function(L){ return has(ok, L.id); }).length;
    document.getElementById('progText').textContent = '已读 ' + done + ' / ' + total;
    document.getElementById('progBar').style.width = (total ? done / total * 100 : 0) + '%';
  }

  document.getElementById('list').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    var id = b.dataset.id, act = b.dataset.act;
    if(act === 'ok'){ toggle(ok, id); if(has(ok,id)) no = no.filter(function(x){return x !== id;}); save(); draw(); return; }
    if(act === 'no'){ toggle(no, id); if(has(no,id)) ok = ok.filter(function(x){return x !== id;}); save(); draw(); return; }
  });

  document.getElementById('moreBtn').onclick = function(){ state.page++; draw(); };
  document.getElementById('resetBtn').onclick = function(){
    if(confirm('清空已读与待回炉标记？')){ ok = []; no = []; save(); draw(); }
  };

  chips(document.getElementById('themeChips'),
    [{k:'', n:'全部 60 封'}].concat(THEMES.map(function(t){ return {k:t, n:t, mini:true}; })),
    function(it){ return state.theme === it.k; },
    function(it){ state.theme = it.k; state.page = 1; });

  chips(document.getElementById('stateChips'),
    [{k:'', n:'全部'}, {k:'todo', n:'还没读', mini:true}, {k:'done', n:'已读', mini:true}, {k:'back', n:'待回炉', mini:true}],
    function(it){ return state.st === it.k; },
    function(it){ state.st = it.k; state.page = 1; });

  document.getElementById('metaLine').textContent =
    '共 ' + letters.length + ' 封 · ' + THEMES.join(' / ')
    + (meta.lastUpdated ? ' · 整理 ' + meta.lastUpdated : '');
  document.getElementById('genLine').textContent = meta.note ? ' ' + meta.note : '';
  draw();
})();
</script>
</body>
</html>
