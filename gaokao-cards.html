<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高考数学真题卡组 · 板块 × 难度</title>
<link rel="stylesheet" href="vendor/katex/katex.min.css">
<script src="vendor/katex/katex.min.js"></script>
<script src="vendor/katex/auto-render.min.js"></script>
<style>
  :root{
    --ink:#1d2430; --ink-2:#4a5464; --ink-3:#7b8698;
    --paper:#ffffff; --paper-2:#f6f7f9; --line:#e2e6ec;
    --blue:#0b5fa5; --blue-soft:#eaf2fa;
    --red:#b02a2a; --red-soft:#fbecec;
    --green:#1a7f4b; --green-soft:#e9f5ee;
    --amber:#a9711a; --amber-soft:#fdf4e4;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
    color:var(--ink); background:var(--paper-2); line-height:1.75; padding:0 0 60px;
    -webkit-font-smoothing:antialiased}
  a{color:var(--blue); text-decoration:none}
  .wrap{max-width:820px; margin:0 auto; padding:0 14px}

  header{border-bottom:1px solid var(--line); background:var(--paper)}
  header .bar{max-width:820px; margin:0 auto; padding:16px 14px 12px}
  header .top{display:flex; align-items:center; gap:12px; flex-wrap:wrap}
  header h1{font-size:1.28rem; font-weight:800; letter-spacing:.5px}
  header .back{margin-left:auto; font-size:.78rem; color:var(--ink-3)}
  header .meta{font-family:var(--mono); font-size:.7rem; color:var(--ink-3); margin-top:8px; line-height:1.7}

  .panel{background:var(--paper); border:1px solid var(--line); border-radius:10px; margin-top:14px}
  .panel .ph{padding:12px 14px 6px; font-family:var(--mono); font-size:.7rem; color:var(--ink-3); letter-spacing:.5px}
  .chips{display:flex; flex-wrap:wrap; gap:6px; padding:6px 14px 12px}
  .chip{font-size:.78rem; padding:5px 11px; border:1px solid var(--line); border-radius:999px;
    background:var(--paper); color:var(--ink-2); cursor:pointer; white-space:nowrap; transition:.15s; user-select:none}
  .chip:hover{border-color:#c4ccd8}
  .chip.on{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600}
  .chip.mini{font-size:.72rem; padding:4px 9px}

  .status{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:0 14px 12px; font-size:.8rem; color:var(--ink-2)}
  .track{flex:1; min-width:120px; height:7px; background:#eceff3; border-radius:4px; overflow:hidden}
  .track i{display:block; height:100%; background:var(--green); width:0%}
  .btn{font-size:.78rem; padding:6px 12px; border:1px solid var(--line); background:var(--paper);
    border-radius:7px; cursor:pointer; color:var(--ink-2)}
  .btn:hover{border-color:#c4ccd8}
  .btn.primary{background:var(--blue); border-color:var(--blue); color:#fff; font-weight:600}

  .list{margin-top:14px; display:flex; flex-direction:column; gap:10px}
  .card{background:var(--paper); border:1px solid var(--line); border-radius:10px; overflow:hidden}
  .card .cm{display:flex; gap:8px; align-items:center; flex-wrap:wrap; padding:10px 14px;
    border-bottom:1px solid var(--line); font-family:var(--mono); font-size:.68rem; color:var(--ink-3)}
  .badge{font-family:var(--mono); font-size:.66rem; padding:2px 7px; border-radius:5px; white-space:nowrap}
  .b-easy{background:var(--green-soft); color:var(--green)}
  .b-mid{background:var(--blue-soft); color:var(--blue)}
  .b-hard{background:var(--red-soft); color:var(--red)}
  .b-final{background:var(--amber-soft); color:var(--amber); font-weight:700}
  .b-src{background:#f1f3f6; color:var(--ink-3)}
  .card .q{padding:14px; font-size:.95rem}
  .card .opt{margin-top:10px; color:var(--ink-2); font-size:.92rem; white-space:pre-line; line-height:2}
  .card .acts{display:flex; gap:8px; align-items:center; padding:0 14px 12px; flex-wrap:wrap}
  .a-body{border-top:1px dashed var(--line); padding:12px 14px; background:#fcfdfe; font-size:.9rem; color:#2a3442}
  .a-body .ans{font-weight:700; color:var(--green); margin-bottom:6px}
  .a-body .sol{white-space:pre-line; line-height:1.9}
  .hidden{display:none!important}
  .mark-ok{border-color:#bfe3cd}
  .mark-no{border-color:#eec9c9}
  .kv{padding:14px}
  .kv h3{font-size:1rem; margin-bottom:8px; color:var(--blue)}
  .kv .row{font-size:.88rem; color:var(--ink-2); margin-bottom:6px}
  .kv .row b{color:var(--ink); font-weight:600}
  .empty{text-align:center; color:var(--ink-3); font-size:.85rem; padding:40px 0}
  .summary{margin-top:16px; background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:12px 14px}
  .summary .row{display:flex; align-items:center; gap:10px; font-size:.8rem; color:var(--ink-2); margin:6px 0}
  .summary .row .nm{width:86px; flex:none}
  .summary .row .track{height:6px}
  footer{max-width:820px; margin:22px auto 0; padding:0 14px; font-family:var(--mono);
    font-size:.68rem; color:var(--ink-3); line-height:1.9}
  @media(max-width:600px){
    header h1{font-size:1.1rem}
    .card .q{font-size:.93rem}
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="top">
      <h1>高考数学真题卡组</h1>
      <a class="back" href="index.html">← 知识卡片站</a>
    </div>
    <div class="meta" id="metaLine">数据加载中…</div>
  </div>
</header>

<div class="wrap">

  <div class="panel">
    <div class="ph">卡组</div>
    <div class="chips" id="deckChips"></div>
    <div class="ph">板块</div>
    <div class="chips" id="boardChips"></div>
    <div class="ph">难度 / 题型</div>
    <div class="chips" id="lvlChips"></div>
    <div class="ph">进度</div>
    <div class="status">
      <span id="progText">已掌握 0 / 0</span>
      <span class="track"><i id="progBar"></i></span>
      <button class="btn" id="resetBtn">重置进度</button>
    </div>
  </div>

  <div class="summary" id="summaryWrap">
    <details>
      <summary style="cursor:pointer;font-family:var(--mono);font-size:.72rem;color:var(--ink-3);outline:none">分板块掌握度（点开查看）</summary>
      <div id="summary" style="margin-top:10px"></div>
    </details>
  </div>

  <div class="list" id="list"></div>
  <div class="empty hidden" id="empty">这个组合下没有卡片，换个筛选试试</div>
  <div style="text-align:center;margin-top:16px">
    <button class="btn primary" id="moreBtn">加载更多</button>
  </div>

  <footer>
    数据底：1969 道真题题集（2015—2026）＋ 历年真题 PDF（1952—2026）· 卡组由脚本按「板块 × 难度」分层抽取并去重<br>
    广东所在为全国 1 卷（数据中卷名标为「新一」）· 题面与解析来自公开整理件，仅供自用练习<br>
    <span id="genLine"></span>
  </footer>
</div>

<script src="gaokao_data.js"></script>
<script>
(function(){
  var cards = window.__gkCards || [], motifs = window.__gkMotifs || [], meta = window.__gkMeta || {};
  var BOARDS = ['集合与逻辑','复数','向量','不等式','排列组合','三角','数列','立体几何','解析几何','概率统计','函数与导数'];
  var LS_OK = 'gk_mastered_v1', LS_NO = 'gk_unfamiliar_v1';
  var mastered = load(LS_OK), unfam = load(LS_NO);

  var state = { deck:'all', board:'', lvl:'', type:'', page:1, per:24 };
  var DECKS = [
    {k:'all',   n:'全部'},
    {k:'motif', n:'母题卡'},
    {k:'final', n:'压轴卡'},
    {k:'give',  n:'送分块'},
    {k:'xinyi', n:'新高考 I 卷'},
    {k:'nofam', n:'只练不熟'}
  ];

  function load(k){ try{ return JSON.parse(localStorage.getItem(k)||'[]'); }catch(e){ return []; } }
  function save(){ try{ localStorage.setItem(LS_OK, JSON.stringify(mastered));
    localStorage.setItem(LS_NO, JSON.stringify(unfam)); }catch(e){} }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function has(a,id){ return a.indexOf(id) >= 0; }
  function toggle(a,id){ var i=a.indexOf(id); if(i<0) a.push(id); else a.splice(i,1); return a; }
  function renderMath(el){ if(window.renderMathInElement){
      try{ renderMathInElement(el, {delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}], throwOnError:false}); }catch(e){} } }

  function filtered(){
    return cards.filter(function(c){
      if(state.board && c['板块'] !== state.board) return false;
      if(state.lvl && c['难度'] !== state.lvl) return false;
      if(state.type && c['题型'] !== state.type) return false;
      if(state.deck === 'final' && !c['压轴']) return false;
      if(state.deck === 'xinyi' && c['卷'] !== '新一') return false;
      if(state.deck === 'give' && BOARDS.slice(0,5).indexOf(c['板块']) < 0) return false;
      if(state.deck === 'nofam' && !has(unfam, c.id)) return false;
      return true;
    });
  }

  function chips(host, items, getOn, onPick){
    host.innerHTML = '';
    items.forEach(function(it){
      var d = document.createElement('div');
      d.className = 'chip' + (getOn(it) ? ' on' : '') + (it.mini ? ' mini' : '');
      d.textContent = it.n;
      d.onclick = function(){ onPick(it); draw(); };
      host.appendChild(d);
    });
  }

  function cardHTML(c){
    var ok = has(mastered, c.id), no = has(unfam, c.id);
    var lvlCls = c['难度'] === '易' ? 'b-easy' : (c['难度'] === '中' ? 'b-mid' : 'b-hard');
    var h = '<div class="card' + (ok ? ' mark-ok' : (no ? ' mark-no' : '')) + '" id="c_' + c.id + '">';
    h += '<div class="cm"><span class="badge b-src">' + esc(c['年']) + ' · ' + esc(c['卷']) + '</span>'
       + '<span class="badge ' + lvlCls + '">' + esc(c['难度']) + '</span>'
       + '<span class="badge b-src">' + esc(c['板块']) + (c['知识点'] ? ' / ' + esc(c['知识点']) : '') + '</span>'
       + '<span class="badge b-src">' + esc(c['题型']) + '</span>'
       + (c['压轴'] ? '<span class="badge b-final">压轴</span>' : '')
       + (ok ? '<span class="badge b-easy">已掌握</span>' : '')
       + (no ? '<span class="badge b-hard">待回炉</span>' : '')
       + '</div>';
    h += '<div class="q">' + esc(c['题干']).replace(/\n/g,'<br>') + '</div>';
    if(c['选项']) h += '<div class="opt">' + esc(c['选项']) + '</div>';
    h += '<div class="acts">'
       + '<button class="btn" data-act="show" data-id="' + c.id + '">看答案</button>'
       + '<button class="btn" data-act="ok" data-id="' + c.id + '">会了</button>'
       + '<button class="btn" data-act="no" data-id="' + c.id + '">不熟</button>'
       + '</div>';
    h += '<div class="a-body hidden" id="a_' + c.id + '">'
       + '<div class="ans">答案：' + esc(c['答案']) + '</div>'
       + '<div class="sol">' + esc(c['解析']) + '</div></div>';
    h += '</div>';
    return h;
  }

  function motifHTML(m, i){
    return '<div class="card"><div class="cm"><span class="badge b-src">母题卡</span>'
      + '<span class="badge b-src">' + esc(m['板块']) + '</span>'
      + '<span class="badge b-mid">' + esc(m['频次']) + '</span></div>'
      + '<div class="kv"><h3>' + esc(m['名称']) + '</h3>'
      + '<div class="row"><b>识别信号：</b>' + esc(m['信号']) + '</div>'
      + '<div class="row"><b>步骤模板：</b>' + esc(m['套路']) + '</div>'
      + '<div class="row"><b>数据口径：</b>' + esc(m['来源']) + '</div></div></div>';
  }

  function draw(){
    var list = document.getElementById('list');
    var all = filtered();
    var show = state.deck === 'motif' ? motifs : all.slice(0, state.page * state.per);

    if(state.deck === 'motif'){
      list.innerHTML = motifs.filter(function(m){ return !state.board || m['板块'] === state.board; })
                            .map(motifHTML).join('');
    } else {
      list.innerHTML = show.map(cardHTML).join('');
    }
    var emptyEl = document.getElementById('empty');
    emptyEl.className = (show.length || state.deck === 'motif' && motifs.length) ? 'empty hidden' : 'empty';
    document.getElementById('moreBtn').style.display =
      (state.deck !== 'motif' && all.length > show.length) ? '' : 'none';
    list.querySelectorAll('.q').forEach(renderMath);
    list.querySelectorAll('.sol').forEach(function(e){ e.dataset.pending = '1'; });
    if(list.querySelector('.card.open')) {}
    updateStatus(all.length);
  }

  function updateStatus(n){
    var total = cards.length, done = mastered.length;
    document.getElementById('progText').textContent = '已掌握 ' + done + ' / ' + total;
    document.getElementById('progBar').style.width = (total ? done / total * 100 : 0) + '%';
    var byBoard = BOARDS.map(function(b){
      var tot = cards.filter(function(c){ return c['板块'] === b; }).length;
      var ok = cards.filter(function(c){ return c['板块'] === b && has(mastered, c.id); }).length;
      return {b:b, tot:tot, ok:ok};
    });
    document.getElementById('summary').innerHTML =
      byBoard.map(function(r){
          var pct = r.tot ? Math.round(r.ok / r.tot * 100) : 0;
          return '<div class="row"><span class="nm">' + r.b + '</span>'
            + '<span class="track"><i style="width:' + pct + '%"></i></span>'
            + '<span style="font-family:var(--mono);font-size:.7rem;color:var(--ink-3);white-space:nowrap">' + r.ok + '/' + r.tot + '</span></div>';
        }).join('');
  }

  document.getElementById('list').addEventListener('click', function(e){
    var b = e.target.closest('button'); if(!b) return;
    var id = b.dataset.id, act = b.dataset.act, c = cards.filter(function(x){ return x.id === id; })[0];
    if(!c) return;
    if(act === 'show'){
      var a = document.getElementById('a_' + id), card = document.getElementById('c_' + id);
      a.classList.toggle('hidden');
      if(!a.dataset.rendered){ renderMath(a); a.dataset.rendered = '1'; }
      b.textContent = a.classList.contains('hidden') ? '看答案' : '收起答案';
      return;
    }
    if(act === 'ok'){
      toggle(mastered, id); if(has(mastered,id)) unfam = unfam.filter(function(x){return x !== id;});
      save(); draw(); return;
    }
    if(act === 'no'){
      toggle(unfam, id); if(has(unfam,id)) mastered = mastered.filter(function(x){return x !== id;});
      save(); draw(); return;
    }
  });

  document.getElementById('moreBtn').onclick = function(){ state.page++; draw(); };
  document.getElementById('resetBtn').onclick = function(){
    if(confirm('清空掌握标记与待回炉标记？')){ mastered = []; unfam = []; save(); draw(); }
  };

  document.getElementById('deckChips').innerHTML = '';
  chips(document.getElementById('deckChips'), DECKS,
    function(it){ return state.deck === it.k; },
    function(it){ state.deck = it.k; state.page = 1; });

  chips(document.getElementById('boardChips'),
    [{k:'', n:'全部板块'}].concat(BOARDS.map(function(b){ return {k:b, n:b, mini:true}; })),
    function(it){ return state.board === it.k; },
    function(it){ state.board = it.k; state.page = 1; });

  chips(document.getElementById('lvlChips'),
    [{k:'', n:'全部难度'}, {k:'易', n:'易', mini:true}, {k:'中', n:'中', mini:true}, {k:'难', n:'难', mini:true},
     {k:'#选择', n:'选择题', mini:true}, {k:'#填空', n:'填空题', mini:true}, {k:'#解答', n:'解答题', mini:true}],
    function(it){ return it.k.indexOf('#') === 0 ? state.type === it.k.slice(1) : state.lvl === it.k; },
    function(it){
      if(it.k.indexOf('#') === 0){ state.type = (state.type === it.k.slice(1)) ? '' : it.k.slice(1); }
      else { state.lvl = it.k; }
      state.page = 1;
    });

  /* KaTeX 已本地内置（vendor/katex），DOM 就绪即首绘；若个别环境渲染库未就绪，2 秒内重试一次 */
  function boot(){
    document.getElementById('metaLine').textContent =
      meta.source + ' · 题卡 ' + cards.length + ' 张 / 母题卡 ' + motifs.length + ' 张'
      + ' · 新高考 I 卷 ' + (meta.counts ? meta.counts['新高考I卷'] : '-') + ' 张'
      + ' · 更新 ' + meta.lastUpdated;
    document.getElementById('genLine').textContent = meta.note || '';
    draw();
    if(!window.renderMathInElement){ setTimeout(function(){ if(window.renderMathInElement) draw(); }, 1500); }
  }
  if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
})();
</script>
</body>
</html>
