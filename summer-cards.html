<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>钰霖暑假学习卡 · 数物地</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Noto Serif SC","Source Han Serif SC",serif;min-height:100vh;
  background:linear-gradient(135deg,#0f0c29,#302b63,#24243e);color:#e0e0e0;padding:20px}
.container{max-width:1000px;margin:0 auto}
.header{text-align:center;padding:24px 0 16px;position:sticky;top:0;z-index:10;
  background:linear-gradient(180deg,rgba(15,12,41,0.98) 0%,rgba(15,12,41,0.85) 80%,transparent 100%);
  backdrop-filter:blur(8px);margin:-20px -20px 0;padding:20px 20px 22px}
.header h1{font-size:1.7rem;font-weight:900;
  background:linear-gradient(90deg,#2ecc71,#1abc9c);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.header .sub{font-size:0.82rem;color:rgba(255,255,255,0.4);margin-bottom:14px}
.back-link{display:inline-block;margin-bottom:10px;color:rgba(255,255,255,0.45);text-decoration:none;font-size:0.78rem}
.back-link:hover{color:#2ecc71}
.search-box{max-width:480px;margin:0 auto 10px}
.search-box input{width:100%;padding:11px 20px;border-radius:30px;border:1px solid rgba(255,255,255,0.12);
  background:rgba(255,255,255,0.07);backdrop-filter:blur(10px);color:#fff;font-size:0.95rem;outline:none;transition:all .3s}
.search-box input:focus{border-color:rgba(46,204,113,0.5);background:rgba(255,255,255,0.12)}
.search-box input::placeholder{color:rgba(255,255,255,0.35)}
.nav-tabs{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-bottom:8px}
.nav-tab{padding:5px 14px;border-radius:18px;cursor:pointer;font-size:0.82rem;
  background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.07);color:rgba(255,255,255,0.5);transition:all .2s;white-space:nowrap}
.nav-tab:hover{background:rgba(255,255,255,0.1);color:#e0e0e0}
.nav-tab.active{background:linear-gradient(135deg,rgba(46,204,113,0.25),rgba(26,188,156,0.18));
  border-color:rgba(46,204,113,0.35);color:#2ecc71;font-weight:500}
.section-title{font-size:1.15rem;font-weight:700;margin:20px 0 12px;padding-bottom:6px;
  border-bottom:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.8)}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-bottom:22px}
.card{background:rgba(255,255,255,0.06);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,0.09);border-radius:14px;padding:18px;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(0,0,0,0.25)}
.card-meta{font-size:0.7rem;color:rgba(255,255,255,0.3);margin-bottom:5px}
.card-title{font-size:1.02rem;font-weight:700;color:#2ecc71;margin-bottom:8px}
.card-content{line-height:1.8;font-size:0.9rem;color:rgba(255,255,255,0.82)}
.card-content p{margin:7px 0}
.card-content ul,.card-content ol{padding-left:20px;margin:6px 0}
.card-content li{margin:4px 0}
.y-label{display:inline-block;font-size:0.78rem;font-weight:700;color:#1abc9c;
  background:rgba(26,188,156,0.12);padding:3px 10px;border-radius:4px;margin:10px 0 5px}
.y-answer{margin-top:12px;border-top:1px dashed rgba(255,255,255,0.12);padding-top:10px}
.y-answer summary{cursor:pointer;font-size:0.82rem;font-weight:700;color:#ffd200;list-style:none;outline:none}
.y-answer summary:hover{color:#ffe066}
.y-answer .answer-body{margin-top:10px;line-height:1.8;font-size:0.88rem;color:rgba(255,210,0,0.85);
  background:rgba(255,210,0,0.05);border-radius:8px;padding:12px;border-left:3px solid rgba(255,210,0,0.4)}
.y-answer .answer-body p{margin:6px 0}
.y-answer .answer-body ul,.y-answer .answer-body ol{padding-left:18px;margin:5px 0}
.y-answer .answer-body li{margin:3px 0}
.y-answer .answer-body .y-label{color:#ffd200;background:rgba(255,210,0,0.12)}
.footer{text-align:center;padding:18px 0;color:rgba(255,255,255,0.2);font-size:0.78rem}
.hidden{display:none!important}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:3px}
@media(max-width:600px){
  .cards-grid{grid-template-columns:1fr}
  .header h1{font-size:1.3rem;line-height:1.3}
  .header .sub{font-size:0.72rem}
  .search-box input{font-size:0.85rem;padding:9px 16px}
  body{padding:10px}.container{max-width:100%}
  .nav-tab{padding:4px 10px;font-size:0.72rem}
  .card{padding:14px}.card-title{font-size:0.95rem}
  .card-content{font-size:0.85rem;line-height:1.7}
}
</style>
</head>
<body>
<div class="container">
<div class="header">
  <a class="back-link" href="index.html">← 返回数学知识卡片主页</a>
  <h1>🗺️ 钰霖暑假学习卡</h1>
  <p class="sub">数 · 物 · 地 · 48期 · 81张</p>
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔍 搜索知识点、题目..." oninput="applyFilter()">
  </div>
  <div class="nav-tabs" id="navTabs"></div>
</div>
<div id="cardsContainer"></div>
<div class="footer">钰霖暑假学习卡 · 数物地 · 归档于 2026-08</div>
</div>

<script src="summer_data.js"></script>
<script>
var __activeCat = 'all';
var __query = '';

var CATS = [
  {key:'all', label:'全部'},
  {key:'map', label:'🗺️ 地图卡'},
  {key:'数学', label:'数学'},
  {key:'物理', label:'物理'},
  {key:'地理', label:'地理'},
  {key:'学习法', label:'学习法'},
  {key:'跨科', label:'跨科'}
];

function renderNav(){
  var html = '';
  CATS.forEach(function(c){
    html += '<div class="nav-tab' + (__activeCat===c.key?' active':'') + '" onclick="setCat('' + c.key + '')">' + c.label + '</div>';
  });
  document.getElementById('navTabs').innerHTML = html;
}

function setCat(k){
  __activeCat = k;
  renderNav();
  renderCards();
}

function applyFilter(){
  __query = document.getElementById('searchInput').value.trim().toLowerCase();
  renderCards();
}

function renderMapCard(m){
  return '<div class="card" data-cat="map" data-search="' + escAttr(m.title + ' ' + m.tag + ' ' + stripTags(m.content)) + '">' +
    '<div class="card-meta">' + escAttr(m.tag) + ' · ' + escAttr(m.time) + '</div>' +
    '<div class="card-title">' + escAttr(m.emoji) + ' ' + escAttr(m.title) + '</div>' +
    '<div class="card-content">' + m.content + '</div>' +
    '</div>';
}

function renderStudyCard(c){
  var meta = escAttr(c.cat) + ' · ' + escAttr(c.time);
  if(c.date){ meta += ' · ' + c.date.slice(5); }
  var ans = '';
  if(c.answer && c.answer.trim()){
    ans = '<details class="y-answer"><summary>✅ 看答案</summary><div class="answer-body">' + c.answer + '</div></details>';
  }
  return '<div class="card" data-cat="' + c.cat + '" data-search="' + escAttr(c.title + ' ' + c.tag + ' ' + c.cat + ' ' + stripTags(c.content) + ' ' + stripTags(c.answer||'')) + '">' +
    '<div class="card-meta">' + meta + '</div>' +
    '<div class="card-title">' + escAttr(c.title) + '</div>' +
    '<div class="card-content">' + c.content + '</div>' +
    ans + '</div>';
}

function escAttr(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function stripTags(h){ return String(h).replace(/<[^>]*>/g,' '); }

function renderCards(){
  var container = document.getElementById('cardsContainer');
  var q = __query;
  var showMap = (__activeCat==='all' || __activeCat==='map');
  var html = '';

  // 地图卡
  if(showMap){
    var mapHtml = '';
    window.__summerMapCards.forEach(function(m){
      var ok = !q || (m.title+' '+m.tag+' '+stripTags(m.content)).toLowerCase().indexOf(q)!==-1;
      if(ok) mapHtml += renderMapCard(m);
    });
    if(mapHtml){
      html += '<div class="section-title">🗺️ 地图卡 · 数物地导览（' + window.__summerMapCards.length + '张）</div><div class="cards-grid">' + mapHtml + '</div>';
    }
  }

  // 学习卡，按学科分组
  var order = ['数学','物理','地理','学习法','跨科','其他'];
  order.forEach(function(cat){
    if(__activeCat!=='all' && __activeCat!==cat) return;
    var items = window.__summerStudyCards.filter(function(c){ return c.cat===cat; });
    if(!items.length) return;
    var cardsHtml = '';
    items.forEach(function(c){
      var ok = !q || (c.title+' '+c.tag+' '+c.cat+' '+stripTags(c.content)+' '+stripTags(c.answer||'')).toLowerCase().indexOf(q)!==-1;
      if(ok) cardsHtml += renderStudyCard(c);
    });
    if(cardsHtml){
      html += '<div class="section-title">' + cat + ' · 学习卡（' + items.length + '张）</div><div class="cards-grid">' + cardsHtml + '</div>';
    }
  });

  if(!html) html = '<p style="text-align:center;color:rgba(255,255,255,0.4);padding:40px 0">未找到匹配的学习卡</p>';
  container.innerHTML = html;
}

renderNav();
renderCards();
</script>
</body>
</html>
